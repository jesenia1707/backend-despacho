version: '3.9'

services:

  backend:
    build: .
    container_name: backend_despachos

    ports:
      - "8081:8081"

    env_file:
      - .env

    depends_on:
      - mysql

    restart: always

  mysql:
    image: mysql:8

    container_name: mysql_despachos

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: despachosdb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: